<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- Maskable icon: platforms crop these to arbitrary shapes, so the background is
       full-bleed and the "S" stays inside the inner 80% safe zone. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131a2e"/>
      <stop offset="1" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" fill="url(#bg)"/>
  <text x="96" y="100" text-anchor="middle" dominant-baseline="central"
        font-family="'Outfit','Inter',system-ui,sans-serif" font-size="112"
        font-weight="800" fill="url(#s)">S</text>
</svg>
